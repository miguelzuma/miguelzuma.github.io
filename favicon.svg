<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Diffraction rings">
  <title>Miguel Zumalacárregui</title>
  <!-- Transparent ground, so the icon sits on whatever the browser or the
       phone's home screen puts behind it. Opacities run higher than they would
       over the site's dark card, since a faint violet ring disappears against
       white. Three rings, not four: at 16px a fourth merges into its neighbour
       and the mark reads as a blob. -->
  <g fill="none" stroke="#8b74e8">
    <circle cx="32" cy="32" r="26" stroke-width="3.5" opacity=".45"/>
    <circle cx="32" cy="32" r="17.5" stroke-width="4.5" opacity=".75"/>
    <circle cx="32" cy="32" r="9" stroke-width="5"/>
  </g>
  <circle cx="32" cy="32" r="4.2" fill="#3aa8c4"/>
</svg>
