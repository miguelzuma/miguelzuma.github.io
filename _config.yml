title: "Miguel Zumalacárregui"
# Both strings land in HTML text, so the ampersand is stored escaped.
#
# tagline  the field list, used only in <title> and the share cards, where a
#          reader (or a search engine) is scanning for a subject.
# slogan   the sentence a human reads under the name on the home page.
#
# Topics live here; the research page is labeled by approach instead
# ("Theory, phenomenology & data interpretation"), so the two do not repeat
# each other. Gravitation leads because it is the theory and the other two
# are the arenas it is applied in -- the same frame-and-predictions structure
# the research-page rosette draws.
tagline: "Gravitation, Cosmology &amp; Astrophysics"
slogan: "Exploring gravitation, cosmology &amp; astrophysics"
description: >-
  Miguel Zumalacárregui leads a research program on wave-optics lensing, dark
  matter, black holes and tests of gravity at the Max Planck Institute for
  Gravitational Physics (Albert Einstein Institute).
# The canonical domain. GitHub Pages reads the CNAME file at the repo root and
# redirects miguelzuma.github.io here, so every absolute URL (sitemap, JSON-LD,
# share cards, the CV PDF) is built against this one.
url: "https://miguelzumalacarregui.es"
# GoatCounter site code -- stats at https://<code>.goatcounter.com/.
# Empty disables analytics entirely (see _includes/analytics.html).
goatcounter: "miguelzuma"
baseurl: ""
lang: en

author:
  name: "Miguel Zumalacárregui"
  email: "miguel.zumalacarregui@aei.mpg.de"
  email_ift: "miguel.zumalacarregui@csic.es"
  orcid: "0000-0002-9943-6490"
  orcid_url: "https://orcid.org/0000-0002-9943-6490"
  inspire: "https://inspirehep.net/authors/1113379"
  scholar: "https://scholar.google.com/citations?user=Zsvsq0MAAAAJ&hl=en"
  ads: "https://ui.adsabs.harvard.edu/search/q=author%3A%22Zumalacarregui%2C%20Miguel%22&sort=date%20desc"
  github: "https://github.com/miguelzuma"
  institutional_page_aei: "https://www.aei.mpg.de/person/104068/25873"
  institutional_page_ift: "https://www.ift.uam-csic.es/en/person/?uid=732"

# Both affiliations, on equal footing, keyed by institution rather than by
# rank: IFT leads wherever the two are listed together.
affiliation:
  ift_name: "Instituto de Física Teórica IFT-UAM/CSIC"
  ift_short: "IFT Madrid"
  ift_url: "https://www.ift.uam-csic.es/"
  ift_role: "Ramón y Cajal Fellow"
  ift_address: "C/ Nicolás Cabrera 13-15, Campus de Cantoblanco UAM, 28049 Madrid, Spain"
  ift_office: "Office 301"
  aei_name: "Max Planck Institute for Gravitational Physics (Albert Einstein Institute)"
  aei_short: "AEI Potsdam"
  aei_url: "https://www.aei.mpg.de/"
  # The acronym everywhere the role is displayed: spelled out, the department
  # name wraps and makes the AEI card taller than the IFT one. The full form
  # survives only in the structured data, where an acronym would be opaque.
  aei_role: "Group Leader, ACR Department"
  aei_role_full: "Group Leader, Astrophysical and Cosmological Relativity (ACR) Department"
  aei_address: "Am Mühlenberg 1, 14476 Potsdam, Germany"
  aei_office: "Office 2.22"

# Social sharing image used for Open Graph / Twitter cards. The research
# rosette rather than a portrait; rebuild it with tools/build_share_card.sh
# after editing tools/share-card.html.
og_image: "/imgs/share-card.png"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

sass:
  style: compressed

plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
  - tools
  # Working files, kept in the repo but not published: the single-file review
  # preview that tools/make_preview.py regenerates, and the conventions notes.
  - site-preview.html
  - docs
