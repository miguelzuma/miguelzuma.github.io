- id: weak-lensing-structures
  date: 2023-11-22
  title: "Weakly lensed gravitational waves"
  full_title: "Weakly lensed gravitational waves: probing cosmic structures with wave-optics features"
  url: "https://inspirehep.net/literature/2667175"
  authors: "Savastano, Tambalo, Villarrubia-Rojo &amp; Zumalacárregui"
  reference: "PRD <strong>108</strong>, 103532 (2023)"
  blurb: >-
    Every gravitational wave is at least weakly lensed, and the resulting
    wave-optics features encode the number, masses, and inner profiles of the
    halos along the line of sight.
  links:
    - text: "Max Planck Yearbook 2023"
      url: "https://www.mpg.de/21438017/aei_jb_2023"

- id: gw-lensing-halos
  date: 2023-11-01
  title: "Lensing as a probe of halo properties"
  full_title: "Gravitational wave lensing as a probe of halo properties and dark matter"
  url: "https://inspirehep.net/literature/2617458"
  authors: "Tambalo, Zumalacárregui, Dai &amp; Cheung"
  reference: "PRD <strong>108</strong>, 103529 (2023)"
  blurb: >-
    Diffraction and central images in a strongly lensed signal measure the mass
    of the lens, the slope of its density profile and the size of its core,
    turning lensed gravitational waves into a test of dark-matter models.

- id: gw-lensing-beyond-gr
  date: 2020-12-01
  title: "Lensing beyond Einstein's theory"
  full_title: "Gravitational wave lensing beyond general relativity: birefringence, echoes and shadows"
  url: "https://journals.aps.org/prd/abstract/10.1103/PhysRevD.102.124048"
  authors: "Ezquiaga &amp; Zumalacárregui"
  reference: "PRD <strong>102</strong>, 124048 (2020)"
  blurb: >-
    In theories beyond Einstein, a lens splits a gravitational wave into
    eigenstates that propagate at different speeds, producing birefringence,
    echoes and shadows.
  badge: "Editors' Suggestion"
  links:
    - text: "AEI highlight"
      url: "https://www.aei.mpg.de/597240/testing-einstein-s-theory-with-lensing-of-gravitational-waves"
