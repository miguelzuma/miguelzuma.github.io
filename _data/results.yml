# Headline results: the works that earn a card. This is not a publication
# list -- INSPIRE is the complete record, and results.html links to it. A few
# entries a year. Newest first is not required: the templates sort by date.
#
#   id        slug. Becomes the entry's anchor on results.html, so it must be
#             unique across that page.
#   date      YYYY-MM-DD, the publication date. Orders both lists and groups
#             the archive by year. Use 01 when the day does not matter.
#   featured  optional. true puts the entry in line for a home-page card; the
#             home page shows the newest few of the flagged ones.
#   title     short form, for the card. No trailing period.
#   full_title  optional. The paper's own title, used in the archive where
#             there is room. Falls back to title.
#   url       one canonical link, used by both the card and the archive.
#             The DOI once published, INSPIRE while a preprint.
#   authors   surname form for the card: "Goyal, Villarrubia-Rojo &amp;
#             Zumalacárregui". Emitted raw, so write &amp; and not &.
#   reference the citation, raw HTML: "ApJL <strong>1008</strong>, L12 (2026)",
#             or "arXiv:2607.11887 (2026)" while it is a preprint. One field
#             rather than separate journal and year fields, because a preprint
#             has no journal and joining two fields would leave the comma.
#             The volume goes in <strong>, as it does everywhere else here.
#   blurb     optional. One sentence: the claim, not how well it was received.
#             Required on a featured entry, since it is the body of the card.
#             Raw HTML, because these carry entities -- M<sub>&#9737;</sub>,
#             &nbsp;, 10<sup>4</sup>.
#   badge     optional, e.g. "Editors' Suggestion".
#   tags      optional [{text, accent}]. Two is the working number: the
#             facility or object first, with accent: true, then the method.
#   links     optional [{text, url}], shown in the archive entry only -- the
#             press release, the data release, the talk. Keep it to the few
#             that a reader would follow; the full coverage is on outreach.html.
#
# The same results are also written by hand on research.html (as .pubs entries
# inside the argument they belong to) and on outreach.html (as press
# paragraphs). Those are prose, not lists, and are deliberately not generated
# from here. When a fact changes -- a DOI on publication, a new press link --
# it has to change in all three.

