# Headline results: the works that earn a card. This is not a publication
# list -- INSPIRE is the complete record, and results.html links to it. A few
# entries a year. Newest first is not required: the templates sort by date.
#
#   id        slug. Becomes the entry's anchor on results.html, so it must be
#             unique across that page.
#   date      YYYY-MM-DD, the publication date. Orders both lists and groups
#             the archive by year. Use 01 when the day does not matter.
#   featured  optional. true puts the entry in line for a home-page card; the
#             home page shows the newest few of the flagged ones.
#   title     short form, for the card. No trailing period.
#   full_title  optional. The paper's own title, used in the archive where
#             there is room. Falls back to title.
#   url       one canonical link, used by both the card and the archive.
#             The DOI once published, INSPIRE while a preprint.
#   authors   surname form for the card: "Goyal, Villarrubia-Rojo &amp;
#             Zumalacárregui". Emitted raw, so write &amp; and not &.
#   reference the citation, raw HTML: "ApJL <strong>1008</strong>, L12 (2026)",
#             or "arXiv:2607.11887 (2026)" while it is a preprint. One field
#             rather than separate journal and year fields, because a preprint
#             has no journal and joining two fields would leave the comma.
#             The volume goes in <strong>, as it does everywhere else here.
#   blurb     optional. One sentence: the claim, not how well it was received.
#             Required on a featured entry, since it is the body of the card.
#             Raw HTML, because these carry entities -- M<sub>&#9737;</sub>,
#             &nbsp;, 10<sup>4</sup>.
#   badge     optional, e.g. "Editors' Suggestion".
#   tags      optional [{text, accent}]. Two is the working number: the
#             facility or object first, with accent: true, then the method.
#   links     optional [{text, url}], shown in the archive entry only -- the
#             press releases, the notable coverage, the data release, the talk.
#             Say what each one is: an institution issuing a press release and
#             an institution running a research highlight are different things,
#             and "University of Oxford" tells the reader neither. The full
#             coverage stays on outreach.html.
#   figure    optional. One representative plot or animation for this result,
#             shown as a thumbnail on results.html. Not a media library: a
#             result that has no figure worth showing simply omits it, and a
#             result with several keeps the rest where they are, in the
#             argument they belong to on research.html.
#               kind    "image" or "video"
#               src     the image (kind: image)
#               poster, webm, mp4   the still and the two encodings (kind: video)
#               width, height   intrinsic pixel size, so the browser reserves
#                       the right shape before the file arrives
#               alt     describes it; becomes alt= or the video's aria-label
#               credit  optional. Who made it, when that is someone other than
#                       the authors of the paper, shown under the thumbnail:
#                       "Illustration: Maria Berti".
#               hero    optional, true. The one figure the home page shows in
#                       full under the cards. At most one featured entry should
#                       carry it, and its `caption` is what appears there.
#               caption required with hero, raw HTML, may carry links
#
# The same results are also written by hand on research.html (as .pubs entries
# inside the argument they belong to) and on outreach.html (as press
# paragraphs). Those are prose, not lists, and are deliberately not generated
# from here. When a fact changes -- a DOI on publication, a new press link --
# it has to change in all three.

- id: gw231123
  date: 2026-08-25
  featured: true
  title: "GW231123: a magnified and diffracted merger"
  full_title: "Across the Universe: GW231123 as a magnified and diffracted black hole merger"
  url: "https://doi.org/10.3847/2041-8213/ae93b1"
  authors: "Goyal, Villarrubia-Rojo &amp; Zumalacárregui"
  reference: "ApJL <strong>1008</strong>, L12 (2026)"
  blurb: >-
    The first compelling candidate for a black-hole merger magnified and
    diffracted by a compact object of 190–850&nbsp;M<sub>&#9737;</sub>.
  tags:
    - text: "LIGO–Virgo–KAGRA"
      accent: true
    - text: "wave optics"
  links:
    - text: "AEI press release"
      url: "https://www.aei.mpg.de/1490509/do-black-holes-pretend-to-have-large-masses"
    - text: "Max Planck press release"
      url: "https://www.mpg.de/26940743/do-black-holes-pretend-to-have-large-masses"
    - text: "Science"
      url: "https://www.science.org/content/article/extreme-black-hole-merger-may-be-cosmic-illusion"
    - text: "Data release"
      url: "https://github.com/glow-astro/GW231123_lensing_PLS"
    - text: "Cosmology Talks"
      url: "https://youtu.be/ZGqOpDTL8k4"
  figure:
    kind: image
    src: "/imgs/GW231123_annotation.png"
    width: 870
    height: 619
    alt: "Time–frequency representation of GW231123 with the modulation expected from a magnified and diffracted signal marked on it."

