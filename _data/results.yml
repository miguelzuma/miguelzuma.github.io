- id: de-after-gw170817
  date: 2017-12-01
  title: "Dark energy after GW170817"
  full_title: "Dark energy after GW170817: dead ends and the road ahead"
  url: "https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.119.251304"
  authors: "Ezquiaga &amp; Zumalacárregui"
  reference: "PRL <strong>119</strong>, 251304 (2017)"
  blurb: >-
    The near-simultaneous counterpart of GW170817 fixes the speed of
    gravitational waves to one part in 10<sup>15</sup>, leaving only three ways
    for a scalar-tensor theory to modify gravity today.
  badge: "Editors' Suggestion"
  links:
