- id: desi-dark-energy
  date: 2025-07-08
  title: "A model-independent reconstruction of dark energy"
  full_title: "Model-independent reconstruction of the dark-energy density in light of DESI BAO data"
  url: "https://doi.org/10.1103/dj3k-84v4"
  authors: "Zumalacárregui et al."
  reference: "PRD <strong>112</strong>, 023518 (2025)"
  blurb: >-
    Dark energy reconstructed straight from CMB, supernova and DESI BAO data,
    with no parameterization assumed, prefers evolution away from a
    cosmological constant at up to 2.4&sigma;.
  badge: "Editors' Suggestion"
  links:
    - text: "AEI highlight"
      url: "https://www.aei.mpg.de/1260854/a-model-independent-reconstruction-of-dark-energy-through-the-universe-s-history"
