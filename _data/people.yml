# Group members, past and present.
#
# Source: CV_Miguel_Zuma.tex, "Supervision & coordination".  Everyone hosted
# from 2020 onwards (the start of the MPI-Grav group) is listed as a group
# member; earlier mentees and short-stay visitors appear under `visitors` or
# `earlier_mentees`.
#
# Fields: name (required), stage (postdoc|phd|masters|intern|undergrad --
# groups the Current members section and labels the Former members rows; `intern` is for
# anyone who worked here on a project rather than on a thesis supervised in
# the group), end (year the person left,
# duration (only given for stays longer than a week), end (year they left,
# used to sort former members and visitors chronologically, newest first; for an
# ongoing collaboration use the current year; 0 when unknown),
# role, years, topic, url (personal page),
# photo (path under /imgs/collaborators/), next (destination, former members only),
# incoming (true -> card shows a "starts <starts>" badge), starts.
#
# To add a photo: drop a square-ish JPG in imgs/collaborators/ and set
# `photo: Name_Surname.jpg`.  Without a photo the card shows initials.
#
# `role` follows one shape throughout, so the same relationship is never
# described two ways:
#
#     Role, Institution (relationship)
#
# The relationship is (co-supervised) or (co-supervised with X). Leave it off
# when the supervision was simply mine, and also in `earlier_mentees`, where
# the section heading already says the supervision was informal: repeating it
# on every line says the same thing twice. The CV template reads this shape:
# _includes/tex-person.html drops the leading role and keeps the rest.

