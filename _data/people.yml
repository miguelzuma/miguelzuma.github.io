# Group members and alumni.
#
# Source: CV_Miguel_Zuma.tex, "Supervision & coordination".  Everyone hosted
# from 2020 onwards (the start of the MPI-Grav group) is listed as a group
# member; earlier mentees and short-stay visitors appear under `visitors` or
# `earlier_mentees`.
#
# Fields: name (required), stage (postdoc|phd|masters|undergrad -- groups the
# Current members section and labels alumni rows), end (year the person left,
# used to sort alumni chronologically; 0 when unknown),
# role, years, topic, url (personal page),
# photo (path under /imgs/collaborators/), next (destination, alumni only),
# incoming (true -> card shows a "starts <starts>" badge), starts.
#
# To add a photo: drop a square-ish JPG in imgs/collaborators/ and set
# `photo: Name_Surname.jpg`.  Without a photo the card shows initials.

