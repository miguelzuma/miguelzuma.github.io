# Short, dated items for the News list on the home page. Newest first is not
# required: the template sorts by date.
#
#   date   YYYY-MM-DD. Only the month is displayed, so the day is just for
#          ordering within a month — use 01 when the exact day does not matter.
#   text   one sentence, plain prose. An event, not a boast: what happened,
#          not how well it was received.
#   links  optional [{text, url}], shown after the sentence.
#
# Items newer than the freshness window (set in index.html) carry a pulsing
# "New" flag, which expires on its own at the next site build.
#
# The four most recent appear on the home page; older ones stay here as the
# record. Past a dozen or so, this wants an archive page rather than a longer
# home page.

- date: 2026-09-01
  text: >-
    The GLOW project website went live, with the science programme, the team
    and the software and data releases of the ERC project.
  links:
    - text: "glow-astro.org"
      url: "https://glow-astro.org/"

- date: 2026-02-01
  text: >-
    Black holes as telescopes, on finding supermassive black-hole binaries
    through quasi-periodic lensed starlight, was published in Physical Review
    Letters as an Editors' Suggestion.
  links:
    - text: "PRL 136, 061403"
      url: "https://dx.doi.org/10.1103/1sfl-87t4"
    - text: "AEI press release"
      url: "https://www.aei.mpg.de/1407139/new-method-could-reveal-hidden-supermassive-black-hole-binaries"

- date: 2026-08-25
  text: >-
    Our analysis of GW231123 as a magnified and diffracted black-hole merger,
    the first compelling candidate of its kind, was published in
    The Astrophysical Journal Letters.
  links:
    - text: "ApJL 1008, L12"
      url: "https://doi.org/10.3847/2041-8213/ae93b1"
    - text: "AEI press release"
      url: "https://www.aei.mpg.de/1490509/do-black-holes-pretend-to-have-large-masses"
    - text: "Cosmology Talk"
      url: "https://youtu.be/ZGqOpDTL8k4"

- date: 2026-08-24
  text: >-
    Beyond-Horndeski (GLPV) theories and the conformally coupled Galileon became
    part of the public hi_class code, widening the set of dark-energy and
    modified-gravity models whose cosmological observables it can compute.
  links:
    - text: "hiclass-code.net"
      url: "https://hiclass-code.net"

- date: 2026-05-29
  text: >-
    A machine-learning method for inferring microlensed gravitational waves,
    fast enough to make wave-optics analysis routine, appeared in Physical
    Review D.
  links:
    - text: "PRD 113, 104073"
      url: "https://inspirehep.net/literature/3081783"

- date: 2025-12-01
  text: >-
    GLOW, Gravitational Lensing of Waves, was awarded an ERC Consolidator Grant
    and starts in 2026.
  links:
    - text: "AEI announcement"
      url: "https://www.aei.mpg.de/1359867/erc-consolidator-grant-for-miguel-zumalac-rregui"
    - text: "ERC results"
      url: "https://erc.europa.eu/news-events/news/erc-2025-consolidator-grants-results"

- date: 2025-06-01
  text: >-
    I was awarded a Ramón y Cajal fellowship by the Spanish Research Agency,
    with the accompanying Atracción de Talento award and the CSIC RyC-MaX
    supplement.
  links:
    - text: "The program"
      url: "/projects.html#ramon-y-cajal"

- date: 2025-01-01
  text: >-
    With Einstein on Crooked Paths began, a philanthropically funded program on
    lensed gravitational waves and the small-scale structure of dark matter,
    supported by Max Planck members as the Society's Annual Project.
  links:
    - text: "Max Planck Annual Project"
      url: "https://www.mpg.de/annualproject2024"
    - text: "AEI feature"
      url: "https://www.aei.mpg.de/1227766/with-einstein-on-crooked-paths"


- date: 2025-07-08
  text: >-
    Our model-independent reconstruction of the dark-energy density in light of
    DESI BAO data was an Editors' Suggestion in Physical Review D.
  links:
    - text: "PRD 112, 023518"
      url: "https://doi.org/10.1103/dj3k-84v4"
    - text: "AEI feature"
      url: "https://www.aei.mpg.de/1260854/a-model-independent-reconstruction-of-dark-energy-through-the-universe-s-history"

- date: 2025-09-01
  text: >-
    GLoW, our code for wave-optics phenomena in gravitational lensing, was
    released publicly, with the methods paper describing how it computes
    amplification factors for general matter distributions.
  links:
    - text: "arXiv:2409.04606"
      url: "https://arxiv.org/abs/2409.04606"
    - text: "GLoW on GitHub"
      url: "https://github.com/glow-astro/GLoW"

- date: 2024-06-20
  text: >-
    Frequency- and polarization-dependent lensing of gravitational waves in
    strong gravitational fields appeared in Physical Review D.
  links:
    - text: "PRD 109, 124045"
      url: "https://inspirehep.net/literature/2151522"
    - text: "AEI feature"
      url: "https://www.aei.mpg.de/1183585/strong-space-time-curvature"

- date: 2023-11-22
  text: >-
    Two papers extended wave-optics lensing to realistic structures: weakly
    lensed signals as a probe of cosmic structure, and lensing as a probe of
    halo properties and dark matter.
  links:
    - text: "PRD 108, 103532"
      url: "https://inspirehep.net/literature/2667175"
    - text: "PRD 108, 103529"
      url: "https://inspirehep.net/literature/2617458"
    - text: "MPG Yearbook 2023"
      url: "https://www.mpg.de/21438017/aei_jb_2023"

- date: 2023-08-23
  text: >-
    Our efficient methods for computing wave-optics amplification factors, and
    their validation against symmetric lenses, appeared in Physical Review D.
  links:
    - text: "PRD 108, 043527"
      url: "https://inspirehep.net/literature/2164124"

- date: 2020-12-21
  text: >-
    Gravitational wave lensing beyond general relativity, on birefringence,
    echoes and shadows, was an Editors' Suggestion in Physical Review D.
  links:
    - text: "PRD 102, 124048"
      url: "https://journals.aps.org/prd/abstract/10.1103/PhysRevD.102.124048"
    - text: "AEI press release"
      url: "https://www.aei.mpg.de/597240/testing-einstein-s-theory-with-lensing-of-gravitational-waves"

- date: 2019-09-01
  text: >-
    hi_class 2.0 was released, together with the paper documenting how the code
    solves the background, sets initial conditions and switches approximation
    schemes.
  links:
    - text: "hiclass-code.net"
      url: "https://hiclass-code.net"
    - text: "arXiv:1909.01828"
      url: "https://arxiv.org/abs/1909.01828"

- date: 2018-10-01
  text: >-
    Our limit on stellar-mass compact objects as dark matter, from the lensing
    of type Ia supernovae, was an Editors' Suggestion in Physical Review
    Letters with an APS Viewpoint.
  links:
    - text: "PRL 121, 141101"
      url: "https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.121.141101"
    - text: "APS Viewpoint"
      url: "https://physics.aps.org/articles/v11/97"

- date: 2017-12-18
  text: >-
    Dark energy after GW170817, on which scalar-tensor theories survive the
    neutron-star merger's bound on the speed of gravity, was an Editors'
    Suggestion in Physical Review Letters with an APS Viewpoint.
  links:
    - text: "PRL 119, 251304"
      url: "https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.119.251304"
    - text: "APS Viewpoint"
      url: "https://physics.aps.org/articles/v10/134"

- date: 2016-05-01
  text: >-
    hi_class, which extends the CLASS Einstein-Boltzmann solver to Horndeski's
    theory, had its first public release.
  links:
    - text: "hiclass-code.net"
      url: "https://hiclass-code.net"
    - text: "JCAP 08 (2017) 019"
