# Research projects and funding.  Amounts are recorded but deliberately not
# used as the visual headline on the Projects page.
#
# Note: GLOW (all caps) is the ERC project.  The software is GLoW, with a
# lowercase "o" -- see _data/software.yml.

current:
  - acronym: "GLOW"
    title: "Gravitational Lensing of Waves"
    funder: "European Research Council — Consolidator Grant"
    dates: "2026–2031"
    role: "Principal Investigator"
    flagship: true
    logo: "/imgs/GLOW_Extended_Logo_Full_Color_for_Dark_Backgrounds_RGB.png"
    # Funding acknowledgement, shown under the card rather than floated beside
    # the project's own logo. The EU wordmark is the white variant, which is
    # what the emblem rules ask for on a dark background.
    funding_logo:
      src: "/imgs/erc_eu_funding_dark.png"
      alt: "Funded by the European Union — European Research Council"
    grant: "Grant agreement 101230608 · 60 months"
    summary: >-
      Gravitational waves and fast radio bursts are coherent: their phase
      survives the journey, so a lens does not merely magnify them but distorts
      their wavefront. GLOW builds the theory, methods and software to exploit
      that. It will search for lensed events in LIGO–Virgo–KAGRA data, probe
      dark-matter objects and cold-dark-matter halos with LISA, use fast radio
      bursts to reach planet-scale lenses, and deliver a new class of tests of
      general relativity and dark energy through lensed propagation. All
      software and data products will be public.
    work_packages:
      - "WP1 — Wave-optics phenomena: microlensing and plasma-lensing theory"
      - "WP2 — Discovering lensed GWs: microlensed waveforms, accelerated inference, populations"
      - "WP3 — Fundamental physics: dark matter, GW propagation and dark energy"
    links:
      - text: "CORDIS project page"
        url: "https://cordis.europa.eu/project/id/101230608"
      - text: "AEI press release"
        url: "https://www.aei.mpg.de/1359867/erc-consolidator-grant-for-miguel-zumalac-rregui"
      - text: "ERC 2025 Consolidator results"
        url: "https://erc.europa.eu/news-events/news/erc-2025-consolidator-grants-results"
      - text: "Max Planck Society announcement"
        url: "https://www.mpg.de/25845263/erc-consolidator-grants-2025"
    note: "A dedicated GLOW project website with work packages, team profiles and openings is in preparation."

  - acronym: "With Einstein on Crooked Paths"
    title: "Mit Einstein auf krummen Wegen"
    funder: "Max Planck Society Annual Project (supporting members)"
    dates: "2024–"
    role: "Principal Investigator"
    logo: "/imgs/2560px-Max-Planck-Gesellschaft.png"
    summary: >-
      A philanthropically funded program developing new methods to identify
      lensed gravitational waves and to use them to probe the small-scale
      structure of dark matter. It set the methodological foundations that led
      to the GLoW code and its first applications. The project also carries an
      explicit outreach commitment: explaining lensed gravitational waves to a
      non-specialist public.
    links:
      - text: "Max Planck Annual Project 2024"
        url: "https://www.mpg.de/annualproject2024"
      - text: "AEI feature"
        url: "https://www.aei.mpg.de/1227766/with-einstein-on-crooked-paths"

  - acronym: "Ramón y Cajal program"
    title: "Ramón y Cajal program"
    funder: "Spanish Research Agency and CSIC"
    dates: "2025–"
    role: "Fellow / Principal Investigator"
    summary: >-
      Three linked components of a single return-to-Spain program: the Ramón y
      Cajal fellowship, the accompanying Atracción de Talento award from the same
      national agency, and the CSIC RyC-MaX supplement. Together they support
      work on the gravitational lensing of electromagnetic sources: static ones
      such as galaxy–galaxy lensing, and variable ones such as quasi-periodic
      lensed starlight from supermassive black-hole binaries and lensed
      transients such as type Ia supernovae. Light and gravitational
      waves are lensed in different regimes, so this line probes black holes,
      dark matter and cosmic expansion by a route complementary to the
      wave-optics work.
    links: []

  - acronym: "GWSky"
    title: "Making Sense of the Gravitational-Wave Sky"
    funder: "European Research Council — Synergy Grant"
    dates: "ongoing"
    role: "Senior collaborator"
    logo: "/imgs/gwsky_logo.png"
    summary: >-
      A multi-PI program on the interpretation of the gravitational-wave sky.
      I contribute the lensing side. A lensed event is not a new kind of source
      but a distorted one, which puts wave-optics signatures squarely at the
      interface between waveform modeling and data analysis: the distortion has
      to enter the templates and the inference machinery before lensing can be
      searched for at catalog scale. The same work cuts the other way, since
      unmodeled lensing is a systematic — a diffracted signal can otherwise be
      read as exotic source physics or as a biased set of parameters.
    links:
      - text: "GWSky team page"
        url: "https://gwsky.org/people/"

# Core funding and fellowships. Unlike `current`, the headline here is the
# position or fellowship itself -- that is the thing worth reading first.
positions:
  - headline: "Group Leader"
    org: "Max Planck Institute for Gravitational Physics (Albert Einstein Institute)"
    dates: "2020–"
    detail: >-
      Research group in the Astrophysical and Cosmological Relativity division.
      Five-year core funding for the PI, two postdoctoral positions and a PhD
      student, which established the group's work on wave-optics lensing.

  - headline: "Marie Skłodowska-Curie Global Fellowship"
    org: "European Commission"
    dates: "2015–2020"
    project: "NLO-CO — Next-to-Leading-Order Cosmology"
    detail: >-
      Novel tests of dark matter, dark energy and gravity. Outgoing phase at the
      Berkeley Center for Cosmological Physics, return phase at IPhT Saclay.
    links:
      - text: "CORDIS record"
        url: "https://cordis.europa.eu/project/id/706434"

  - headline: "Nordita Fellowship"
    org: "Nordic Institute for Theoretical Physics, Stockholm"
    dates: "2015–2017"
    detail: >-
      Two-year independent fellowship on scalar–tensor gravity and dark-energy
      phenomenology.

  - headline: "FPI doctoral fellowship"
    org: "Spanish Ministry of Science"
    dates: "2008–2012"
    detail: >-
      Four-year PhD funding at ICC Barcelona and IFT-UAM/CSIC, with research
      stays in Heidelberg and Oslo.
