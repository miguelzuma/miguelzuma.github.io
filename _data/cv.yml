# Curriculum vitae content, rendered twice: cv.html for the website and cv.tex
# for the PDF at files/CV_Miguel_Zumalacarregui.pdf. Edit here, never in either
# template, or the two drift apart.
#
# Supervision is not in this file: it comes from people.yml, which already
# drives the Group page.
#
# Entry fields, all optional except `lead`:
#   lead       the headline, bold (or a link, given lead_url)
#   lead_url   makes the headline a link instead
#   lead_em    italic clause after the headline, preceded by a comma
#   lead_rest  continuation of the headline, in ordinary weight
#   meta       list of quieter lines under it. Each is either a plain string,
#              or `text` plus `links` when part of it should be a link:
#
#                meta:
#                  - "Nordita, Stockholm · 2015–2017"
#                  - text: "Dissertation:"
#                    links:
#                      - text: "Probing the Foundations"
#                        url: "/files/PhD_thesis_miguel_zuma.pdf"
#
# A url starting with "/" is resolved against the site, so it works in both the
# page and the PDF. Write "·" for a separator; the LaTeX template converts it.

# How the PDF groups the Supervision section. The people come from people.yml,
# which already drives the Group page: `stages` picks them out of its `current`
# and `former` lists, in that order. `default_roles` are the roles the heading
# already states, left off each line. `style: paragraph` runs the group as
# running text instead of a list, for the groups with the most names in them.
#
# The website has no Supervision section — the Group page is that, in full.
supervision_groups:
  - heading: "Postdoctoral researchers"
    stages: ["postdoc"]
    default_roles: ["Postdoctoral researcher", "Postdoc"]

  - heading: "PhD students"
    stages: ["phd"]
    default_roles: ["PhD student"]

  - heading: "Master's students"
    stages: ["masters"]
    style: "paragraph"

  - heading: "Research interns and undergraduates"
    stages: ["intern", "undergrad"]
    style: "paragraph"

