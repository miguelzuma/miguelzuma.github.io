<!doctype html>
<meta charset="utf-8">
<!--
  Source for imgs/share-card.png, the Open Graph / Twitter card image.
  Rendered by tools/build_share_card.sh at exactly 1200x630, the size every
  social platform crops to. The geometry is the research rosette from
  _includes/venn-glyph.html, with every set lit: a share card has no hover.
-->
<title>Share card</title>
<style>
  :root {
    --bg:        #0a0c11;
    --text:      #e8eaf0;
    --text-soft: #c2c8d6;
    --text-mute: #9198a8;
    --accent:    #b7a2ff;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 400 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    gap: 56px;
    padding: 0 72px;
    /* A faint wash behind the rosette, so the card is not a flat rectangle. */
    background-image: radial-gradient(700px 500px at 26% 50%, #171b28 0%, var(--bg) 70%);
  }
  .art { flex: 0 0 470px; }
  svg { width: 470px; height: 370px; display: block; }
  .venn-frame {
    fill: none; stroke: var(--accent); stroke-opacity: 0.85;
    stroke-width: 1.4; stroke-dasharray: 5 5;
  }
  .venn-flabel {
    fill: var(--accent); font-size: 10px; letter-spacing: 0.14em;
  }
  .venn-set circle {
    fill: currentColor; fill-opacity: 0.4;
    stroke: currentColor; stroke-opacity: 1; stroke-width: 1.5;
  }
  .venn-set text { fill: var(--text); font-size: 13px; }
  .venn-set-cosmology  { color: #d9a63f; }
  .venn-set-blackholes { color: #5583d9; }
  .venn-set-lensing    { color: #8b74e8; }
  .venn-set-waves      { color: #3f9d6e; }

  h1 { font-size: 62px; line-height: 1.05; font-weight: 600; letter-spacing: -0.01em; }
  .tagline { margin-top: 18px; font-size: 30px; color: var(--text-soft); }
  .rule { margin-top: 28px; width: 84px; height: 3px; background: var(--accent); }
  .domain { margin-top: 26px; font-size: 22px; color: var(--text-mute); letter-spacing: 0.02em; }
</style>
<div class="art">
  <svg viewBox="0 0 320 252" aria-hidden="true">
    <rect class="venn-frame" x="10" y="10" width="300" height="232" rx="18"/>
    <text class="venn-flabel" x="160" y="30" text-anchor="middle">GENERAL RELATIVITY</text>
    <g class="venn-set venn-set-cosmology">
      <circle cx="126" cy="104" r="58"/>
      <text x="96" y="88" text-anchor="middle">Cosmology</text>
    </g>
    <g class="venn-set venn-set-blackholes">
      <circle cx="194" cy="104" r="58"/>
      <text x="224" y="88" text-anchor="middle">Black holes</text>
    </g>
    <g class="venn-set venn-set-lensing">
      <circle cx="126" cy="164" r="58"/>
      <text x="96" y="178" text-anchor="middle">Gravitational<tspan x="96" dy="13">lensing</tspan></text>
    </g>
    <g class="venn-set venn-set-waves">
      <circle cx="194" cy="164" r="58"/>
      <text x="224" y="178" text-anchor="middle">Gravitational<tspan x="224" dy="13">waves</tspan></text>
    </g>
  </svg>
</div>
<div>
  <h1>Miguel<br>Zumalacárregui</h1>
  <p class="tagline">Gravitation, Cosmology &amp; Astrophysics</p>
  <div class="rule"></div>
  <p class="domain">miguelzumalacarregui.es</p>
</div>
